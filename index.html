<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Connection Pattern Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F6F3EC;
    --card: #FBF9F4;
    --ink: #574C3F;
    --soft: #8C7F6D;
    --line: #E7DECF;
    --accent: #D97534;
    --accent-soft: #F4E7D9;
    --good: #6F816A;
    --terra: #9B5A45;
    --font-head: 'Libre Baskerville', Georgia, serif;
    --font-body: 'Almarai', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 36px 20px; position: relative; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  h1 { font-family: var(--font-head); font-size: 1.7rem; line-height: 1.3; margin: 0 0 10px; font-weight: 700; }
  h2 { font-family: var(--font-head); font-size: 1.25rem; margin: 34px 0 10px; font-weight: 700; }
  h3 { font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 30px 0 8px; }
  p { margin: 0 0 14px; }
  .sub { color: var(--soft); font-size: 1.02rem; margin-bottom: 22px; }
  .muted { color: var(--soft); font-size: 0.92rem; }
  button { font-family: inherit; cursor: pointer; }
  .btn {
    display: inline-block; background: var(--accent); color: #fff; border: none;
    padding: 14px 26px; border-radius: 10px; font-size: 1rem; font-weight: 600;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.9; }
  .btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .cast-cap { text-align: center; color: var(--soft); font-size: 0.92rem; font-style: italic; margin: 2px 0 22px; }
  .progress { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.25s; }
  .qcount { font-size: 0.85rem; color: var(--soft); margin-bottom: 22px; }
  .prompt { font-size: 0.9rem; color: var(--soft); margin-bottom: 12px; }
  .qtext { font-size: 1.3rem; line-height: 1.35; margin-bottom: 26px; font-weight: 600; }
  .scale { display: flex; flex-direction: column; gap: 10px; }
  .scale button {
    text-align: left; background: var(--card); border: 1.5px solid var(--line);
    border-radius: 10px; padding: 13px 16px; font-size: 1rem; color: var(--ink);
    transition: border-color 0.12s, background 0.12s;
  }
  .scale button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .scale button.sel { border-color: var(--accent); background: var(--accent-soft); }
  .scale .num { display: inline-block; width: 22px; color: var(--accent); font-weight: 700; }
  .navrow { display: flex; justify-content: space-between; margin-top: 24px; align-items: center; }
  .back { background: none; border: none; color: var(--soft); font-size: 0.95rem; padding: 6px; }
  .field { display: block; margin-bottom: 16px; }
  .field label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: var(--soft); }
  .field input {
    width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 10px;
    font-size: 1rem; font-family: inherit; background: #fff;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .err { color: #a83c3c; font-size: 0.88rem; margin: 4px 0 12px; min-height: 1em; }
  .report p { font-size: 1.04rem; }
  .glance { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin: 10px 0 28px; box-shadow: 0 1px 3px rgba(87,76,63,0.06); }
  .stat { background: var(--card); padding: 17px 18px; display: flex; gap: 13px; align-items: center; }
  .stat-ic { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, currentColor 15%, transparent); }
  .stat-ic svg { width: 27px; height: 27px; }
  .stat-label { font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--soft); }
  .stat-val { font-family: var(--font-head); font-weight: 700; font-size: 1.02rem; line-height: 1.22; margin-top: 3px; color: var(--ink); }
  @media (max-width: 520px) { .glance { grid-template-columns: 1fr; } }
  .loop { border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; margin: 10px 0 20px; font-size: 1.08rem; }
  .practice { margin: 6px 0; padding-left: 4px; }
  .practice li { margin-bottom: 8px; }
  .linkbox { background: #f3eee6; border: 1px dashed var(--line); border-radius: 10px; padding: 14px 16px; margin: 18px 0; font-size: 0.9rem; word-break: break-all; }
  .center { text-align: center; }
  .hide { display: none; }
  hr { border: none; border-top: 1px solid var(--line); margin: 30px 0; }
  .report-mode .wrap { max-width: 1000px; }
  .report-layout { display: flex; gap: 30px; align-items: flex-start; }
  .char-panel { flex: 0 0 300px; position: sticky; top: 24px; align-self: flex-start; }
  .report-main { flex: 1 1 auto; min-width: 0; }
  /* Character card — full trading card image (name + traits baked in) */
  .char-card-img { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 0 10px 30px rgba(30,25,18,0.22), 0 2px 8px rgba(30,25,18,0.12); }
  /* Share section */
  .share-box { margin-top: 16px; }
  .share-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--soft); font-weight: 700; text-align: center; margin-bottom: 10px; }
  .share-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .share-btn { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-family: var(--font-body); font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease; text-decoration: none; }
  .share-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(87,76,63,0.12); }
  .share-btn:active { transform: translateY(0); }
  .share-btn svg { width: 17px; height: 17px; flex: 0 0 auto; }
  .share-btn.primary { grid-column: 1 / -1; background: var(--accent); color: #fff; border-color: var(--accent); }
  .share-btn.download { grid-column: 1 / -1; }
  .share-hint { font-size: 0.72rem; color: var(--soft); text-align: center; margin-top: 9px; line-height: 1.4; }
  .share-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 0.88rem; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 9999; }
  .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 760px) {
    .report-layout { flex-direction: column; }
    .char-panel { position: static; flex-basis: auto; width: 100%; max-width: 360px; margin: 0 auto 16px; }
    /* When the device has a native share sheet, collapse to just the Share button */
    .share-box.has-native .share-btn:not(.primary),
    .share-box.has-native .share-hint { display: none; }
    .share-box.has-native .share-btn.primary { grid-column: 1 / -1; }
  }
  .report-main h2 { display: flex; align-items: center; gap: 12px; }
  .hicon { display: inline-flex; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; align-items: center; justify-content: center; background: color-mix(in srgb, currentColor 14%, transparent); }
  .hicon svg { width: 24px; height: 24px; }
  .principles { background: var(--accent-soft); border-radius: 14px; padding: 22px 22px 10px; margin-top: 28px; }
  .principles .pr-title { font-family: var(--font-head); font-weight: 700; margin-bottom: 16px; }
  .pr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; }
  .pr { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; font-size: 0.9rem; }
  .pr-ic { flex: 0 0 auto; display: inline-flex; width: 40px; height: 40px; border-radius: 11px; align-items: center; justify-content: center; background: color-mix(in srgb, currentColor 14%, transparent); }
  .pr-ic svg { width: 26px; height: 26px; }
  /* --- paneled report (UI/UX pass) --- */
  .report-mode #app { background: transparent; border: none; box-shadow: none; padding: 6px 0 0; }
  .report-main h2 { font-size: 1.3rem; margin: 0 0 14px; }
  .rhead { margin-bottom: 30px; }
  .rhead h1 { margin-bottom: 16px; padding: 0 34px; font-size: 1.95rem; }
  .report-main .lead { font-size: 1.18rem; line-height: 1.64; color: var(--ink); margin: 4px 0 0; padding: 0 34px; max-width: 66ch; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 30px 34px; margin-bottom: 28px; box-shadow: 0 1px 3px rgba(87,76,63,0.05); }
  .panel p { max-width: 64ch; }
  .panel > p:last-child, .panel > ul:last-child { margin-bottom: 0; }
  .panel.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .half h3.phead { display: flex; align-items: center; gap: 10px; font-family: var(--font-head); font-size: 1.04rem; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0 0 10px; }
  @media (max-width: 680px) { .panel.contrast { grid-template-columns: 1fr; gap: 6px; } }
  .loopcard { background: #36302A; border: none; border-radius: 18px; padding: 28px 34px; margin-bottom: 28px; box-shadow: 0 4px 14px rgba(54,48,42,0.18); }
  .loopcard-label { display: flex; align-items: center; gap: 12px; font-family: var(--font-head); font-weight: 700; font-size: 1.12rem; margin-bottom: 12px; color: #F6F3EC; }
  .loopcard .loop { border-left: none; padding: 0; margin: 0; font-size: 1.12rem; line-height: 1.64; font-style: italic; color: #ECE4DA; max-width: 66ch; }
  .closing { padding: 6px 34px 0; }
  .closing p { color: var(--soft); max-width: 64ch; }
  .linkcard { background: #36302A; border: none; border-radius: 18px; padding: 28px 30px; margin-top: 28px; text-align: center; box-shadow: 0 4px 14px rgba(54,48,42,0.18); }
  .linkcard-title { font-family: var(--font-head); font-weight: 700; font-size: 1.08rem; color: #F6F3EC; }
  .linkcard .muted { color: #C9BEAF; max-width: 48ch; margin: 8px auto 0; }
  .linkrow { display: flex; gap: 10px; margin-top: 18px; justify-content: center; }
  .linkfield { flex: 1 1 auto; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 0.84rem; color: var(--soft); font-family: ui-monospace, monospace; }
  .linkfield:focus { outline: none; border-color: var(--accent); }
  .linkrow .btn { flex: 0 0 auto; padding: 12px 22px; }
  #copylink.copied { background: var(--good); }
  .practice-intro { font-size: 1.06rem; color: var(--ink); margin: 0 0 16px; max-width: 64ch; }
  .handoff { text-align: center; margin-top: 24px; }
  .handoff p { font-family: var(--font-head); font-size: 1.08rem; color: var(--ink); max-width: 52ch; margin: 0 auto; }
  .disclaimer { text-align: center; font-size: 0.8rem; color: var(--soft); line-height: 1.55; max-width: 60ch; margin: 34px auto 6px; padding-top: 22px; border-top: 1px solid var(--line); }
</style>
</head>

  <div id="app" class="card"></div>
</div>
